name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            qemu-system-x86 \
            gcc-x86-64-elf \
            binutils-x86-64-elf

      - name: Build kernel
        run: |
          make clean
          make
          make iso

      - name: Run kernel in QEMU (smoke test)
        run: |
          timeout 30 qemu-system-x86_64 \
            -kernel build/kernel.elf \
            -serial stdio \
            -no-reboot \
            -no-shutdown \
            -display none || true

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-elf
          path: build/kernel.elf
          retention-days: 7

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-iso
          path: build/aegis.iso
          retention-days: 7

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            qemu-system-x86 \
            gcc-x86-64-elf \
            binutils-x86-64-elf

      - name: Build kernel
        run: |
          make clean
          make

      - name: Run basic kernel test
        run: |
          timeout 10 qemu-system-x86_64 \
            -kernel build/kernel.elf \
            -serial stdio \
            -no-reboot \
            -no-shutdown \
            -display none 2>&1 | grep -q "Aegis microkernel" && echo "TEST PASSED" || echo "TEST FAILED"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/kernel-elf/kernel.elf
            artifacts/aegis-iso/aegis.iso
          generate_release_notes: true